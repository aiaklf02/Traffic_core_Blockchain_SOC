  # ============================================================================
  # CLI - Outil d'administration
  # ============================================================================
  
  cli:
    user: root
    container_name: cli
    build:
      context: .
      dockerfile: Dockerfile.cli
    labels:
      service: hyperledger-fabric
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - FABRIC_LOGGING_SPEC=INFO
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.org1.traffic-network.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/org1.traffic-network.com/peers/peer0.org1.traffic-network.com/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/org1.traffic-network.com/peers/peer0.org1.traffic-network.com/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/org1.traffic-network.com/peers/peer0.org1.traffic-network.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/org1.traffic-network.com/users/Admin@org1.traffic-network.com/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
      - /home/aya/traffic-core/network/organizations:/organizations
      - ../channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../../chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode
      - ../peercfg:/etc/hyperledger/peercfg
      - ../scripts:/opt/gopath/src/github.com/hyperledger/fabric/peer/scripts
      - /home/aya/traffic-core/network/configtx:/configtx
    depends_on:
      - peer0.org1.traffic-network.com
      - peer0.org2.traffic-network.com
      - peer0.org3.traffic-network.com
    networks:
      - traffic-network

  # CCAAS chaincode services
  road-manager-ccaas:
    image: road-manager-ccaas:latest
    container_name: road-manager-ccaas
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - CHAINCODE_ID=road-manager_1.0:8a05d3dd84fadb8e834184c752e927965911b811fe5dc510d75194b80831821d
    ports:
      - 9999:9999
