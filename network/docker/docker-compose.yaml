      - CORE_PEER_ID=peer0.org2.traffic-network.com
      - CORE_PEER_ADDRESS=peer0.org2.traffic-network.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.traffic-network.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.org2.traffic-network.com:8061
