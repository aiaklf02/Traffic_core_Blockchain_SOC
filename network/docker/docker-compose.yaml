      - CORE_PEER_ADDRESS=peer0.org1.traffic-network.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.traffic-network.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.org1.traffic-network.com:7061
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.traffic-network.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.org1.traffic-network.com:9444
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0org1"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - ../organizations/peerOrganizations/org1.traffic-network.com/peers/peer0.org1.traffic-network.com:/etc/hyperledger/fabric
      - peer0.org1.traffic-network.com:/var/hyperledger/production
      - ../peercfg:/etc/hyperledger/peercfg
      - /var/run/docker.sock:/var/run/docker.sock
      - ../ccaas_builder:/opt/hyperledger/ccaas_builder:rw
    working_dir: /root
    command: peer node start
    ports:
      - 7051:7051
      - 9444:9444

  peer1.org1.traffic-network.com:
    container_name: peer1.org1.traffic-network.com
